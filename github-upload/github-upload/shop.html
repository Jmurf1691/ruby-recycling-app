<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ruby Recycling — Used Auto Parts For Sale</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{ --navy:#1f3864; --navy-dark:#152845; --gold:#b7791f; --light:#f2f2f2; --border:#d9dbe0; --gray:#595959; --green:#1e7e34; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#222;background:#fafafa;}
  header{background:var(--navy);color:#fff;padding:22px 24px;text-align:center;}
  header h1{margin:0 0 6px;font-size:26px;}
  header p{margin:0;color:#cbd5e8;font-size:14px;}
  .contact-bar{background:var(--gold);color:#fff;text-align:center;padding:8px;font-size:13.5px;}
  .contact-bar a{color:#fff;font-weight:bold;}
  main{max-width:1200px;margin:0 auto;padding:20px 20px 60px;}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
  .toolbar input, .toolbar select{padding:9px 10px;border:1px solid var(--border);border-radius:5px;font-size:14px;}
  .toolbar input{flex:1;min-width:220px;}
  .count{color:var(--gray);font-size:13px;margin-bottom:14px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;}
  .card{background:#fff;border:1px solid var(--border);border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06);display:flex;flex-direction:column;}
  .card .photo{width:100%;aspect-ratio:4/3;background:var(--light);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .card .photo img{width:100%;height:100%;object-fit:cover;}
  .card .photo .noimg{color:#aaa;font-size:13px;}
  .card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1;}
  .card h3{margin:0;font-size:15px;color:var(--navy);line-height:1.3;}
  .card .desc{font-size:13px;color:var(--gray);}
  .card .meta{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;}
  .tag{padding:2px 8px;border-radius:10px;background:var(--light);color:var(--navy);font-weight:bold;}
  .tag.grade-A{background:#e5f3e8;color:var(--green);}
  .tag.grade-B{background:#fdf1de;color:var(--gold);}
  .tag.grade-C{background:#fbe7e7;color:#b02a2a;}
  .price{font-size:19px;font-weight:bold;color:var(--navy);margin-top:auto;}
  .card .cta{display:flex;gap:6px;margin-top:6px;}
  .cta a{flex:1;text-align:center;background:var(--navy);color:#fff;text-decoration:none;padding:8px;border-radius:5px;font-size:13px;}
  .cta a:hover{background:var(--navy-dark);}
  .empty{padding:60px 20px;text-align:center;color:var(--gray);font-style:italic;}
  footer{text-align:center;color:var(--gray);font-size:12px;padding:20px;}
</style>
</head>
<body>

<header>
  <h1>Ruby Recycling — Used Auto Parts</h1>
  <p>Quality-graded recycled parts, pulled and inspected in-house.</p>
</header>
<div class="contact-bar">
  Call <a href="tel:+15555550100" target="_blank" rel="noopener noreferrer">(555) 555-0100</a> or email <a href="mailto:parts@rubyrecycling.example" target="_blank" rel="noopener noreferrer">parts@rubyrecycling.example</a> to buy — update this contact info in shop.html
</div>

<main>
  <div class="toolbar">
    <input type="text" id="searchBox" placeholder="Search make, model, part...">
    <select id="categoryFilter"><option value="">All categories</option></select>
    <select id="gradeFilter"><option value="">All grades</option></select>
  </div>
  <div class="count" id="resultCount"></div>
  <div class="grid" id="partsGrid"></div>
</main>

<footer>Inventory updates automatically. Prices subject to availability.</footer>

<script>
const SUPABASE_URL = 'https://wnvqvbkgjrqjqyiiuygu.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndudnF2YmtnanJxanF5aWl1eWd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyMTU4MDksImV4cCI6MjEwMTc5MTgwOX0.m3zm1nu4kJ8YHemNqI5Vo4albb8YM8iiddMS5cAN0Ro';
const PHOTO_BUCKET = 'intake-photos';

/* Minimal read-only REST helper — no external SDK needed for a public, read-only page */
async function sbSelect(view, orderCol, ascending){
  let url = SUPABASE_URL + '/rest/v1/' + view + '?select=*';
  if(orderCol) url += '&order=' + orderCol + '.' + (ascending===false ? 'desc' : 'asc');
  try{
    const res = await fetch(url, { headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY } });
    if(!res.ok) return { data: null, error: { message: res.statusText } };
    return { data: await res.json(), error: null };
  }catch(e){ return { data: null, error: { message: 'Network error' } }; }
}

function esc(s){ return String(s===undefined||s===null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtMoney(n){ n = Number(n)||0; return '$' + n.toLocaleString(undefined,{minimumFractionDigits:0, maximumFractionDigits:2}); }
function photoUrl(path){ return SUPABASE_URL + '/storage/v1/object/public/' + PHOTO_BUCKET + '/' + path; }

let PARTS = [];
let PHOTOS_BY_PART = {};

async function loadShop(){
  const grid = document.getElementById('partsGrid');
  grid.innerHTML = '<div class="empty">Loading inventory…</div>';
  const [{ data: parts, error: partsErr }, { data: photos, error: photosErr }] = await Promise.all([
    sbSelect('public_parts_for_sale', 'date_listed', false),
    sbSelect('public_part_photos'),
  ]);
  if(partsErr){ grid.innerHTML = '<div class="empty">Could not load inventory right now. Please check back shortly.</div>'; console.error(partsErr); return; }
  PARTS = parts || [];
  PHOTOS_BY_PART = {};
  (photos||[]).forEach(p=>{ (PHOTOS_BY_PART[p.part_id] = PHOTOS_BY_PART[p.part_id] || []).push(p.storage_path); });

  const catSel = document.getElementById('categoryFilter');
  const cats = [...new Set(PARTS.map(p=>p.category).filter(Boolean))].sort();
  catSel.innerHTML = '<option value="">All categories</option>' + cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');

  render();
}

function render(){
  const search = document.getElementById('searchBox').value.toLowerCase();
  const cat = document.getElementById('categoryFilter').value;
  const grade = document.getElementById('gradeFilter').value;
  let rows = PARTS.filter(p=>{
    if(cat && p.category!==cat) return false;
    if(grade && p.grade!==grade) return false;
    if(search){
      const hay = [p.year,p.make,p.model,p.trim,p.category,p.description,p.hollander_no].join(' ').toLowerCase();
      if(!hay.includes(search)) return false;
    }
    return true;
  });
  document.getElementById('resultCount').textContent = rows.length + ' part' + (rows.length===1?'':'s') + ' available';
  const grid = document.getElementById('partsGrid');
  if(!rows.length){ grid.innerHTML = '<div class="empty">No parts match your search right now.</div>'; return; }
  grid.innerHTML = rows.map(p=>{
    const photos = PHOTOS_BY_PART[p.part_id] || [];
    const img = photos.length ? `<img src="${photoUrl(photos[0])}" loading="lazy" alt="${esc(p.description)}">` : '<div class="noimg">No photo yet</div>';
    const title = [p.year, p.make, p.model, p.trim].filter(Boolean).join(' ');
    const gradeTag = p.grade ? `<span class="tag grade-${esc(p.grade)}">Grade ${esc(p.grade)}</span>` : '';
    const subject = encodeURIComponent('Inquiry: ' + p.part_id + ' — ' + p.description);
    return `<div class="card">
      <div class="photo">${img}</div>
      <div class="body">
        <h3>${esc(title)}</h3>
        <div class="desc">${esc(p.description)}${p.hollander_no ? ' · #'+esc(p.hollander_no) : ''}</div>
        <div class="meta">${gradeTag}<span class="tag">${esc(p.category||'')}</span>${p.qty>1?`<span class="tag">Qty ${p.qty}</span>`:''}</div>
        <div class="price">${fmtMoney(p.list_price)}</div>
        <div class="cta">
          <a href="mailto:parts@rubyrecycling.example?subject=${subject}" target="_blank" rel="noopener noreferrer">Email</a>
          <a href="tel:+15555550100" target="_blank" rel="noopener noreferrer">Call</a>
        </div>
      </div>
    </div>`;
  }).join('');
}

document.getElementById('searchBox').addEventListener('input', render);
document.getElementById('categoryFilter').addEventListener('change', render);
document.getElementById('gradeFilter').addEventListener('change', render);
loadShop();
</script>
</body>
</html>
